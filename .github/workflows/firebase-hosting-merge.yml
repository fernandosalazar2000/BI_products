name: Deploy to Firebase Hosting on merge

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIPRODUCTS }}
          channelId: live
          projectId: chz-bi-cmf-firebase-bde08
